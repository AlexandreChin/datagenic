[pytest]
testpaths = tests
# repo root on sys.path so `import datagenic` and `import postprocessors_udfs` resolve under
# `pytest` / `uv run pytest` (the console script doesn't add cwd the way
# `python -m pytest` does).
pythonpath = .
# importlib import mode lets feature subdirectories reuse the same test-file
# basename (e.g. quantities/scalar/test_semantics.py and quantities/array/
# test_semantics.py) without __init__.py files or name collisions.
addopts = -ra --import-mode=importlib
markers =
    integration: requires network, credentials, or external services (cloud storage)
    slow: long-running (benchmarks, large-scale generation); opt in explicitly
    cloud: exercises a cloud storage backend (auto-applied to tests/storage/)
    agent: relates to the opt-in LLM `agent` semantic inferrer (auto-applied by path)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
